version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/meowmail.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: meowmail

build:
  toolchains: []
  run_buildscript: false

images:
  - id: meowmail
    target: service
    service: meowmail
    source: docker.io/czyt/meowmail
    channel: stable
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: 妙邮
      source: https://github.com/ca-x/meowmail
      source_author: ca-x
  private:
    enabled: true
    skip_if_version_exists: true
    name: 妙邮
    summary: Published from GitHub Actions
