application:
  subdomain: meowmail
  multi_instance: true
  background_task: true
  upstreams:
    - location: /
      backend: http://meowmail:8080/
  injects:
    - id: meowmail-login-autofill
      on: browser
      when:
        - /login
      do:
        - src: |
            (() => {
              const password = String(ctx.params.password || "");
              if (!password) return;

              const timerKey = "__meowmailLazycatLoginTimer";
              if (window[timerKey]) window.clearInterval(window[timerKey]);

              const startedAt = Date.now();
              const stop = () => {
                if (window[timerKey]) window.clearInterval(window[timerKey]);
                delete window[timerKey];
              };
              const attempt = () => {
                if (Date.now() - startedAt > 10000) {
                  stop();
                  return;
                }

                const input = document.querySelector("#pin");
                const form = input?.closest("form");
                if (!(input instanceof HTMLInputElement) || !(form instanceof HTMLFormElement)) return;

                if (input.value !== password) {
                  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")?.set;
                  if (!setter) {
                    stop();
                    return;
                  }
                  setter.call(input, password);
                  input.dispatchEvent(new InputEvent("input", {
                    bubbles: true,
                    inputType: "insertText",
                    data: password,
                  }));
                  input.dispatchEvent(new Event("change", { bubbles: true }));
                  return;
                }

                const submit = form.querySelector(".login-submit");
                if (!(submit instanceof HTMLButtonElement) || submit.disabled) return;

                stop();
                if (typeof form.requestSubmit === "function") form.requestSubmit(submit);
                else submit.click();
              };

              window[timerKey] = window.setInterval(attempt, 300);
              attempt();
            })();
          params:
            password: "{{ .U.meowmail_pin }}"
services:
  meowmail:
    # upstream: docker.io/czyt/meowmail:v0.1.0
    image: registry.lazycat.cloud/czyt/czyt/meowmail:bd617b18dbafa1d4
    environment:
      - MEOWMAIL_PIN={{ .U.meowmail_pin }}
      - TZ={{ .U.timezone }}
    binds:
      - /lzcapp/var/data:/data
    user: "root"
    mem_limit: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
