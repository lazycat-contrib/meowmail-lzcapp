application:
  subdomain: meowmail
  multi_instance: true
  background_task: true
  upstreams:
    - location: /
      backend: http://meowmail:8080/
  injects:
    - id: meowmail-login-autofill
      on: browser
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            password: "{{ .U.meowmail_pin }}"
            requireUser: false
            allowPasswordOnly: true
            passwordSelector: "#pin"
            submitSelector: ".login-submit"
            autoSubmit: true

services:
  meowmail:
    image: docker.io/czyt/meowmail:0.1.0
    environment:
      - MEOWMAIL_PIN={{ .U.meowmail_pin }}
      - TZ={{ .U.timezone }}
    binds:
      - /lzcapp/var/data:/data
    run_as: 10001
    mem_limit: 512M
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

usage: Open Meowmail from the launcher. The deployment PIN is filled and submitted automatically on the login page.
